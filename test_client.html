<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Diffuser Image Generator</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 0 20px;
      color: #333;
    }
    input, button {
      padding: 10px 14px;
      font-size: 15px;
      border-radius: 8px;
    }
    input {
      width: calc(100% - 130px);
      border: 1px solid #ccc;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      width: 110px;
    }
    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    #status {
      margin-top: 12px;
      font-size: 14px;
      color: #64748b;
    }
    #resultImg {
      margin-top: 20px;
      max-width: 100%;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      display: none;
    }
  </style>
</head>
<body>

  <h2>Generate Image with Local Diffuser</h2>
  <div style="display: flex; gap: 10px;">
    <input id="promptInput" type="text" placeholder="Enter prompt e.g. a cozy cabin in snowy mountains" value="a cozy cabin in snowy mountains, 4k" />
    <button id="genBtn" onclick="generateImage()">Generate</button>
  </div>
  <div id="status">Ready</div>
  <img id="resultImg" alt="Generated Output" />

  <script>
    async function generateImage() {
      const prompt = document.getElementById("promptInput").value.trim();
      const status = document.getElementById("status");
      const btn = document.getElementById("genBtn");
      const img = document.getElementById("resultImg");

      if (!prompt) return alert("Please enter a prompt!");

      btn.disabled = true;
      status.textContent = "Generating on GPU (please wait ~10-15 seconds)...";
      img.style.display = "none";

      try {
        const response = await fetch("http://127.0.0.1:8000/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt: prompt,
            negative_prompt: "blurry, low quality, distorted",
            width: 512,
            height: 512,
            seed: Math.floor(Math.random() * 1000000),
            num_inference_steps: 20
          })
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.detail || "Server error");
        }

        const data = await response.json();
        
        // Display base64 image returned from server.py
        img.src = "data:" + data.mimeType + ";base64," + data.imageBase64;
        img.style.display = "block";
        status.textContent = "Done! Seed: " + data.meta.seed;
      } catch (error) {
        status.textContent = "Error: " + error.message;
      } finally {
        btn.disabled = false;
      }
    }
  </script>

</body>
</html>
